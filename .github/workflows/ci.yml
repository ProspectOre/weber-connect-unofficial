name: CI

on:
  pull_request:
    types: [synchronize]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Native integration
    # Persistent runners accept only trusted same-repository branches. Fork
    # pull requests are hard-stopped and never execute submitted code locally.
    if: >-
      github.event_name != 'pull_request'
      || (github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.type != 'Bot'
      && github.event.sender.type != 'Bot'
      && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association))
    runs-on: [self-hosted, macOS, ARM64, weber, mbp]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: runner.os == 'Linux'
        with:
          python-version: "3.14"
          cache: pip
      - name: Configure local Python
        if: runner.os != 'Linux'
        run: |
          set -euo pipefail
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 14), sys.version'
          python3 -m venv "$RUNNER_TEMP/weber-venv"
          echo "$RUNNER_TEMP/weber-venv/bin" >> "$GITHUB_PATH"
      - name: Install validation runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements-runtime.txt
          python -m pip install \
            aioesphomeapi==45.3.1 \
            aiousbwatcher==1.1.2 \
            bandit==1.9.4 \
            homeassistant==2026.7.2 \
            mypy==1.19.1 \
            pip-audit==2.10.0 \
            pytest==9.0.3 \
            pytest-cov==7.1.0 \
            pytest-homeassistant-custom-component==0.13.346 \
            ruff==0.15.22 \
            serialx==1.8.2
      - name: Lint and type-check
        run: |
          ruff check custom_components tests_native scripts
          ruff format --check custom_components tests_native scripts
          mypy --python-version 3.14 --strict --ignore-missing-imports custom_components/weber_connect
          bandit -q -r custom_components/weber_connect scripts
      - name: Run native integration tests
        env:
          PYTHONASYNCIODEBUG: "1"
          PYTHONWARNINGS: error::RuntimeWarning
        run: >-
          pytest -q --asyncio-mode=auto tests_native
          --cov=custom_components/weber_connect
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=95
      - name: Validate release contract
        run: python scripts/validate_release.py
      - name: Audit runtime dependency
        run: >-
          pip-audit --requirement requirements-runtime.txt
          --no-deps --disable-pip
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.x"
          cache: false
      - name: Lint workflows
        env:
          GOBIN: ${{ runner.temp }}/bin
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@03d0035246f3e81f36aed592ffb4bebf33a03106
          "$GOBIN/actionlint"

  hassfest:
    name: Hassfest
    if: >-
      github.event_name != 'pull_request'
      || (github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.type != 'Bot'
      && github.event.sender.type != 'Bot'
      && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association))
    runs-on: [self-hosted, macOS, ARM64, weber, mbp]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb
        if: runner.os == 'Linux'
      - name: Run Hassfest validation
        if: runner.os != 'Linux'
        run: >-
          docker run --rm
          --volume "$GITHUB_WORKSPACE:/github/workspace"
          ghcr.io/home-assistant/hassfest@sha256:312b431380054cb036e383dd6a7cd004d71c6740c4447afe4b8474f9f0cb193e

  hacs:
    name: HACS
    if: >-
      github.event_name != 'pull_request'
      || (github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.type != 'Bot'
      && github.event.sender.type != 'Bot'
      && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association))
    runs-on: [self-hosted, macOS, ARM64, weber, mbp]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Keep the canonical HACS action for Linux runners and release-contract
      # validation. GitHub does not support Docker container actions on macOS.
      - uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        if: runner.os == 'Linux'
        with:
          category: integration
      # Docker container actions are Linux-runner-only. Invoke the same pinned
      # validator image explicitly so the repo-scoped macOS runner can run it.
      - name: Run HACS validation
        if: runner.os != 'Linux'
        env:
          INPUT_GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          docker run --rm
          --volume "$GITHUB_WORKSPACE:/github/workspace"
          --env GITHUB_WORKSPACE=/github/workspace
          --env INPUT_GITHUB_TOKEN
          --env REPOSITORY
          --env REPOSITORY_REF
          --env INPUT_CATEGORY=integration
          --env INPUT_COMMENT=false
          ghcr.io/hacs/action@sha256:41f6310585d9fb72c7a0e183cce0594355715bc24112b62bc4279b83412edccb

  ci:
    name: ci
    if: >-
      always()
      && (github.event_name != 'pull_request'
      || (github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.type != 'Bot'
      && github.event.sender.type != 'Bot'
      && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)))
    needs: [validate, hassfest, hacs]
    runs-on: [self-hosted, macOS, ARM64, weber, mbp]
    timeout-minutes: 5
    steps:
      - name: Require every release gate
        env:
          VALIDATE: ${{ needs.validate.result }}
          HASSFEST: ${{ needs.hassfest.result }}
          HACS: ${{ needs.hacs.result }}
        run: |
          echo "native integration: $VALIDATE"
          echo "hassfest: $HASSFEST"
          echo "hacs: $HACS"
          test "$VALIDATE" = success
          test "$HASSFEST" = success
          test "$HACS" = success
