name: CI

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Native integration
    if: >-
      github.event_name != 'pull_request'
      || (github.event.pull_request.draft == false
      && (github.event.pull_request.user.login == 'dependabot[bot]'
      || (github.event.pull_request.user.type != 'Bot'
      && github.event.sender.type != 'Bot'
      && (github.event.pull_request.head.repo.full_name != github.repository
      || contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)))))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: 'false'
      - name: Require job disk headroom
        run: |
          set -euo pipefail
          available_kb="$(df -Pk "$RUNNER_TEMP" | awk 'NR == 2 {print $4}')"
          minimum_kb=$((8 * 1024 * 1024))
          if (( available_kb < minimum_kb )); then
            echo "Runner has ${available_kb} KiB free; 8 GiB is required before validation."
            exit 1
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
          cache: pip
      - name: Install validation runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements-runtime.txt
          python -m pip install \
            aioesphomeapi==45.3.1 \
            aiousbwatcher==1.1.2 \
            bandit==1.9.4 \
            homeassistant==2026.7.2 \
            mypy==1.19.1 \
            pip-audit==2.10.0 \
            pytest==9.0.3 \
            pytest-cov==7.1.0 \
            pytest-homeassistant-custom-component==0.13.346 \
            ruff==0.15.22 \
            serialx==1.8.2
      - name: Lint and type-check
        run: |
          ruff check custom_components tests_native scripts
          ruff format --check custom_components tests_native scripts
          mypy --python-version 3.14 --strict --ignore-missing-imports custom_components/weber_connect
          bandit -q -r custom_components/weber_connect scripts
      - name: Run native integration tests
        env:
          PYTHONASYNCIODEBUG: '1'
          PYTHONWARNINGS: error::RuntimeWarning
        run: pytest -q --asyncio-mode=auto tests_native --cov=custom_components/weber_connect --cov-branch --cov-report=term-missing --cov-fail-under=100
      - name: Validate release contract
        run: python scripts/validate_release.py
      - name: Audit runtime dependency
        run: pip-audit --requirement requirements-runtime.txt --no-deps --disable-pip
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.25.x
          cache: 'false'
      - name: Lint workflows
        env:
          GOBIN: ${{ runner.temp }}/bin
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@03d0035246f3e81f36aed592ffb4bebf33a03106
          "$GOBIN/actionlint"

  hassfest:
    name: Hassfest
    if: >-
      github.event_name != 'pull_request'
      || (github.event.pull_request.draft == false
      && (github.event.pull_request.user.login == 'dependabot[bot]'
      || (github.event.pull_request.user.type != 'Bot'
      && github.event.sender.type != 'Bot'
      && (github.event.pull_request.head.repo.full_name != github.repository
      || contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)))))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: 'false'
      - uses: home-assistant/actions/hassfest@58bff37c8947f690ace498be413a9b78d6f30f93

  hacs:
    name: HACS
    if: >-
      github.event_name != 'pull_request'
      || (github.event.pull_request.draft == false
      && (github.event.pull_request.user.login == 'dependabot[bot]'
      || (github.event.pull_request.user.type != 'Bot'
      && github.event.sender.type != 'Bot'
      && (github.event.pull_request.head.repo.full_name != github.repository
      || contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)))))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: 'false'
      - uses: hacs/action@d556e736723344f83838d08488c983a15381059a
        with:
          category: integration

  ci:
    name: ci
    if: >-
      always()
      && (github.event_name != 'pull_request'
      || (github.event.pull_request.draft == false
      && (github.event.pull_request.user.login == 'dependabot[bot]'
      || (github.event.pull_request.user.type != 'Bot'
      && github.event.sender.type != 'Bot'
      && (github.event.pull_request.head.repo.full_name != github.repository
      || contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association))))))
    needs: [validate, hassfest, hacs]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every release gate
        env:
          VALIDATE: ${{ needs.validate.result }}
          HASSFEST: ${{ needs.hassfest.result }}
          HACS: ${{ needs.hacs.result }}
        run: |
          echo "native integration: $VALIDATE"
          echo "hassfest: $HASSFEST"
          echo "hacs: $HACS"
          test "$VALIDATE" = success
          test "$HASSFEST" = success
          test "$HACS" = success
