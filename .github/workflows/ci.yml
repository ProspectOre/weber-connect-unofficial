name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]

permissions:
  contents: read

# Every PR runs the same gates, whoever opened it. A title or body edit, or a
# draft marked ready, changes no code: that run rechecks attribution and
# reports the last code run's result for the same head instead of rerunning.
env:
  RECHECK: ${{ github.event.action == 'ready_for_review' || (github.event.action == 'edited' && !github.event.changes.base) }}

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{
    (github.event.action == 'ready_for_review' || (github.event.action == 'edited' && !github.event.changes.base))
    && github.run_id || 'code' }}
  cancel-in-progress: true

jobs:
  attribution:
    name: Attribution
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: 'false'
      - name: Check for AI attribution
        run: python3 .github/scripts/attribution.py

  matrix:
    name: Resolve Home Assistant matrix
    if: ${{ !(github.event.action == 'ready_for_review' || (github.event.action == 'edited' && !github.event.changes.base)) }}
    runs-on: ubuntu-latest
    outputs:
      full_matrix: ${{ steps.resolve.outputs.full_matrix }}
      latest_matrix: ${{ steps.resolve.outputs.latest_matrix }}
      coverage_note: ${{ steps.resolve.outputs.coverage_note }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: 'false'
      - name: Check the delivery contract
        run: python3 .github/scripts/delivery-contract.py .
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - id: resolve
        run: python3 scripts/ha_compatibility.py matrix --github-output "$GITHUB_OUTPUT"

  validate:
    name: ${{ matrix.label }}
    needs: [matrix]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.full_matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: 'false'
      - name: Require job disk headroom
        run: |
          set -euo pipefail
          available_kb="$(df -Pk "$RUNNER_TEMP" | awk 'NR == 2 {print $4}')"
          minimum_kb=$((8 * 1024 * 1024))
          if (( available_kb < minimum_kb )); then
            echo "Runner has ${available_kb} KiB free; 8 GiB is required before validation."
            exit 1
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
          cache: pip
      - name: Install lane validation runtime
        env:
          LANE: ${{ matrix.lane }}
        run: |
          python -m pip install --upgrade pip
          python scripts/ha_compatibility.py requirements --lane "$LANE" > "$RUNNER_TEMP/ha-requirements.txt"
          python -m pip install --requirement requirements-runtime.txt --requirement "$RUNNER_TEMP/ha-requirements.txt" \
            bandit==1.9.4 mypy==1.19.1 pip-audit==2.10.0 ruff==0.15.22
      - name: Lint and type-check
        run: |
          ruff check custom_components tests_native scripts
          ruff format --check custom_components tests_native scripts
          mypy --python-version 3.14 --strict --ignore-missing-imports custom_components/weber_connect
          bandit -q -r custom_components/weber_connect scripts
      - name: Run complete native integration suite with coverage
        env:
          PYTHONASYNCIODEBUG: '1'
          PYTHONWARNINGS: error::RuntimeWarning
        run: pytest -q --asyncio-mode=auto tests_native --cov=custom_components/weber_connect --cov-branch --cov-report=term-missing --cov-fail-under=100
      - name: Validate release contract
        run: python scripts/validate_release.py
      - name: Validate support registry and product matrix
        run: |
          python scripts/support.py validate
          python scripts/support.py render --check
      - name: Audit runtime dependency
        run: pip-audit --requirement requirements-runtime.txt --no-deps --disable-pip
      - if: matrix.lane == 'minimum'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: 1.25.x
          cache: 'false'
      - if: matrix.lane == 'minimum'
        name: Lint workflows
        env:
          GOBIN: ${{ runner.temp }}/bin
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@03d0035246f3e81f36aed592ffb4bebf33a03106
          "$GOBIN/actionlint"

  latest-smoke:
    name: ${{ matrix.label }}
    needs: [matrix]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.latest_matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: 'false'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
          cache: pip
      - name: Install latest HA smoke runtime
        run: |
          python -m pip install --upgrade pip
          python scripts/ha_compatibility.py requirements --lane latest > "$RUNNER_TEMP/ha-requirements.txt"
          python -m pip install --requirement requirements-runtime.txt --requirement "$RUNNER_TEMP/ha-requirements.txt"
      - name: Report coverage scope
        env:
          NOTE: ${{ needs.matrix.outputs.coverage_note }}
        run: echo "$NOTE" >> "$GITHUB_STEP_SUMMARY"
      - name: Run import and pure-protocol smoke
        run: python scripts/ha_compatibility.py smoke

  hassfest:
    name: Hassfest
    if: ${{ !(github.event.action == 'ready_for_review' || (github.event.action == 'edited' && !github.event.changes.base)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: 'false'
      - uses: home-assistant/actions/hassfest@cd6f3635a740c84d8a14f6121a90068b8ece6bf6

  hacs:
    name: HACS
    if: ${{ !(github.event.action == 'ready_for_review' || (github.event.action == 'edited' && !github.event.changes.base)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: 'false'
      - uses: hacs/action@d556e736723344f83838d08488c983a15381059a
        with:
          category: integration

  ci:
    name: ci
    if: always()
    needs: [attribution, matrix, validate, latest-smoke, hassfest, hacs]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      checks: read
    steps:
      - name: Require every release gate
        if: ${{ !fromJSON(env.RECHECK) }}
        env:
          ATTRIBUTION: ${{ needs.attribution.result }}
          MATRIX: ${{ needs.matrix.result }}
          VALIDATE: ${{ needs.validate.result }}
          LATEST_SMOKE: ${{ needs.latest-smoke.result }}
          HASSFEST: ${{ needs.hassfest.result }}
          HACS: ${{ needs.hacs.result }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "attribution: $ATTRIBUTION"
          echo "matrix resolution: $MATRIX"
          echo "native integration matrix: $VALIDATE"
          echo "latest Home Assistant smoke: $LATEST_SMOKE"
          echo "hassfest: $HASSFEST"
          echo "hacs: $HACS"
          if [ "$EVENT" = pull_request ]; then test "$ATTRIBUTION" = success; fi
          test "$MATRIX" = success
          test "$VALIDATE" = success
          test "$LATEST_SMOKE" = success
          test "$HASSFEST" = success
          test "$HACS" = success
      - name: Require attribution and the last code run for this head
        if: ${{ fromJSON(env.RECHECK) }}
        env:
          ATTRIBUTION: ${{ needs.attribution.result }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$ATTRIBUTION" = success
          own=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .check_suite_id)
          for _ in $(seq 110); do
            prior=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs?check_name=ci&filter=all&per_page=100" --jq "
              [.check_runs[] | select(.app.slug == \"github-actions\" and .check_suite.id < $own
               and .conclusion != \"cancelled\" and .conclusion != \"skipped\")] | max_by(.id)
              | select(.) | \"\\(.status) \\(.conclusion) \\(.html_url)\"")
            if [ -z "$prior" ]; then echo "No code run for this head yet; push or reopen to run CI."; exit 1; fi
            read -r status conclusion url <<<"$prior"
            if [ "$status" = completed ]; then echo "Last code run: $conclusion ($url)"; test "$conclusion" = success; exit; fi
            sleep 30
          done
          echo "The last code run for this head did not finish."; exit 1
