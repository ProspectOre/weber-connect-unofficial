name: CodeQL

on:
  push:
    branches: ["main", "master", "release/3.2.x"]
  pull_request:
    types: [synchronize]
  schedule:
    - cron: "21 02 * * 0"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (python)
    if: >-
      (github.event.repository.private == false || github.event_name == 'workflow_dispatch')
      && (github.event_name != 'pull_request'
      || (github.event.pull_request.user.type != 'Bot'
      && github.event.sender.type != 'Bot'
      && (github.event.pull_request.head.repo.full_name != github.repository
      || contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association))))
    # All analysis runs use an ephemeral hosted worker, including manual branch runs.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:python"
          # Fork runs use a read-only GITHUB_TOKEN; keep analysis local to the job.
          upload: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
